name: Mobile iOS Release

run-name: iOS IPA ${{ github.event.client_payload.ref || inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码仓库 ref（branch/tag/commit）'
        required: true
        type: string
      release_env:
        description: '运行时后端环境'
        required: true
        type: choice
        default: test
        options: [test, production]
      version:
        description: '可选 semver 覆盖；留空读取源码 app.config.ts'
        required: false
        type: string
      build_number:
        description: '可选 CFBundleVersion；留空查询 App Store Connect'
        required: false
        type: string
      build_number_offset:
        description: '自动 build number 上追加的偏移'
        required: false
        default: '0'
        type: string
      submit:
        description: '构建后上传 App Store Connect / TestFlight'
        required: true
        default: false
        type: boolean
      upload_release:
        description: '构建完成后创建 GitHub Release 并上传 IPA'
        required: true
        default: true
        type: boolean
      what_to_test:
        description: 'TestFlight What to Test 文案'
        required: false
        default: 'Mobile app build'
        type: string
      clear_cache:
        description: '忽略已有构建缓存'
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [mobile-ios-release, ios-release]

permissions:
  contents: read

concurrency:
  group: ios-distribution
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.RELEASE_SOURCE_REPO }}
  MOBILE_PLATFORM: ios
  MOBILE_SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref }}
  MOBILE_TARGET: production
  MOBILE_RELEASE_ENV: ${{ github.event.client_payload.release_env || inputs.release_env || 'test' }}
  MOBILE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
  MOBILE_BUILD_NUMBER: ${{ github.event.client_payload.build_number || inputs.build_number }}
  MOBILE_BUILD_NUMBER_OFFSET: ${{ github.event.client_payload.build_number_offset || inputs.build_number_offset || '0' }}
  MOBILE_ARTIFACT_PREFIX: ${{ secrets.MOBILE_ARTIFACT_PREFIX || vars.MOBILE_ARTIFACT_PREFIX || 'mobile-app' }}
  RELEASE_TAG_PREFIX: ${{ secrets.RELEASE_TAG_PREFIX || vars.RELEASE_TAG_PREFIX }}
  SUBMIT_TO_STORE: ${{ (toJSON(github.event.client_payload.submit) == 'true' || (github.event_name == 'workflow_dispatch' && inputs.submit == true)) && 'true' || 'false' }}
  UPLOAD_RELEASE: ${{ (toJSON(github.event.client_payload.upload_private_release) == 'false' || github.event.client_payload.upload_private_release == 'false' || toJSON(github.event.client_payload.upload_release) == 'false') && 'false' || (github.event_name == 'workflow_dispatch' && inputs.upload_release == false && 'false' || 'true') }}
  IOS_TESTFLIGHT_CHANGELOG: ${{ github.event.client_payload.what_to_test || inputs.what_to_test || 'Mobile app build' }}
  CLEAR_CACHE: ${{ github.event.client_payload.clear_cache || inputs.clear_cache }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      release_env: ${{ steps.resolve.outputs.release_env }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: tools
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const tools = JSON.parse(fs.readFileSync('scripts/native/toolchain.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${tools.node}\n`);
          NODE

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.node }}

      - name: Run pipeline unit tests
        run: node --test "scripts/**/*.test.mjs"

      - name: Resolve release inputs
        id: resolve
        env:
          IOS_APP_BUNDLE_ID: ${{ secrets.IOS_APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/resolve-release.mjs

  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      version: ${{ steps.build_env.outputs.BUILD_VERSION }}
      uploaded: ${{ steps.release.outputs.uploaded }}
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_APP_FLAVOR: ${{ secrets.MOBILE_APP_FLAVOR }}
      EXPO_PUBLIC_APP_CHANNEL: production
      EXPO_PUBLIC_RELEASE_ENV: ${{ needs.prepare.outputs.release_env }}
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Validate source repo configuration
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO" || { echo "RELEASE_SOURCE_REPO Secret is required" >&2; exit 1; }
          test -n "$GH_TOKEN" || { echo "RELEASE_SOURCE_REPO_PAT Secret is required" >&2; exit 1; }
          test "$(gh api "repos/$SOURCE_REPO" --jq .private)" = true || { echo "Release source repository must be private" >&2; exit 1; }

      - name: Checkout source app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.MOBILE_SOURCE_REF }}
          token: ${{ secrets.RELEASE_SOURCE_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare shared mobile dependencies
        uses: ./.github/actions/prepare-mobile
        with:
          platform: ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Print Apple toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve app version and artifact name
        id: build_env
        env:
          BUILD_PLATFORM: ios
          BUILD_TARGET: ${{ needs.prepare.outputs.target }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: node scripts/prepare-build-env.mjs

      - name: Verify Expo release configuration
        working-directory: source/apps/mobile
        env:
          EXPECTED_APP_ID: ${{ secrets.IOS_APP_BUNDLE_ID }}
        run: bunx expo config --type public --json | node ../../../scripts/verify-release-config.mjs ios

      - name: Generate iOS native project
        working-directory: source/apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Update iOS native version
        run: node scripts/set-ios-version.mjs source/apps/mobile

      - name: Restore App Store Connect API key
        if: env.SUBMIT_TO_STORE == 'true'
        shell: bash
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_KEY_P8_BASE64" || { echo "ASC_API_KEY_P8_BASE64 is required" >&2; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID is required" >&2; exit 1; }
          mkdir -p .private
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > ".private/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install iOS signing files
        id: signing
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: bash scripts/install-ios-signing.sh

      - name: Install CocoaPods dependencies
        working-directory: source/apps/mobile/ios
        run: pod install

      - name: Build signed IPA
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MOBILE_APP_ROOT: ${{ github.workspace }}/source/apps/mobile
          IOS_OUTPUT_DIR: ${{ github.workspace }}/.private/artifacts
          IOS_BUILD_LOG_DIR: ${{ runner.temp }}/gym-logs
          IOS_DERIVED_DATA_PATH: ${{ runner.temp }}/ios-derived-data
          IOS_XCODE_CLEAN: ${{ env.CLEAR_CACHE }}
          IOS_OUTPUT_NAME: ${{ steps.build_env.outputs.ARTIFACT_NAME }}
          IOS_PROFILE_APP_NAME: ${{ steps.signing.outputs.app_name }}
          IOS_PROFILE_WIDGET_NAME: ${{ steps.signing.outputs.widget_name }}
          IOS_PROJECT_NAME: ${{ secrets.IOS_PROJECT_NAME }}
          IOS_SCHEME: ${{ secrets.IOS_SCHEME }}
          IOS_APP_TARGET: ${{ secrets.IOS_APP_TARGET }}
          IOS_WIDGET_TARGET: ${{ secrets.IOS_WIDGET_TARGET }}
          IOS_APP_BUNDLE_ID: ${{ secrets.IOS_APP_BUNDLE_ID }}
          IOS_WIDGET_BUNDLE_ID: ${{ secrets.IOS_WIDGET_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p .private/artifacts "$IOS_BUILD_LOG_DIR" "$IOS_DERIVED_DATA_PATH"
          bundle exec fastlane ios build_ipa

      - name: Collect IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          source_path=".private/artifacts/${ARTIFACT_NAME}"
          test -f "$source_path" || { echo "没有找到 IPA：$source_path" >&2; find .private/artifacts -type f | sort; exit 1; }
          digest=$(shasum -a 256 "$source_path" | awk '{print $1}')
          size=$(stat -f%z "$source_path")
          printf '%s  %s\n' "$digest" "$ARTIFACT_NAME" > ".private/artifacts/${BUILD_TARGET}.sha256"

          TARGET="$BUILD_TARGET" VERSION="$BUILD_VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
          ARTIFACT_NAME="$ARTIFACT_NAME" SHA256="$digest" SIZE="$size" \
          RELEASE_ENV="${{ needs.prepare.outputs.release_env }}" SOURCE_REF="$MOBILE_SOURCE_REF" \
          SOURCE_REPO="$SOURCE_REPO" node - <<'NODE'
          const fs = require('fs');
          const summary = {
            platform: 'ios',
            target: process.env.TARGET,
            version: process.env.VERSION,
            buildNumber: process.env.BUILD_NUMBER,
            artifactName: process.env.ARTIFACT_NAME,
            sha256: process.env.SHA256,
            sizeBytes: Number(process.env.SIZE),
            signingMode: 'provided',
            releaseEnv: process.env.RELEASE_ENV,
            sourceRepo: process.env.SOURCE_REPO,
            sourceRef: process.env.SOURCE_REF,
          };
          fs.writeFileSync(`.private/artifacts/${process.env.TARGET}.json`, `${JSON.stringify(summary, null, 2)}\n`);
          NODE

          ls -lh .private/artifacts

      - name: Publish signed package to the private source repository
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SOURCE_REPO_PAT }}
          RELEASE_SOURCE_REPO: ${{ env.SOURCE_REPO }}
          RELEASE_REF: ${{ env.MOBILE_SOURCE_REF }}
          RELEASE_RELEASE_ENV: ${{ needs.prepare.outputs.release_env }}
          RELEASE_EXPECTED_TARGETS: ${{ needs.prepare.outputs.target }}
          RELEASE_OSS_ENABLED: ${{ secrets.RELEASE_OSS_ENABLED }}
          RELEASE_OSS_BUCKET: ${{ secrets.RELEASE_OSS_BUCKET }}
          RELEASE_OSS_REGION: ${{ secrets.RELEASE_OSS_REGION }}
          RELEASE_OSS_PREFIX: ${{ secrets.RELEASE_OSS_PREFIX }}
          RELEASE_OSS_ENDPOINT: ${{ secrets.RELEASE_OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/publish-release.mjs

      - name: Upload IPA to App Store Connect / TestFlight
        if: env.SUBMIT_TO_STORE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/.private/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          IOS_IPA_PATH: ${{ github.workspace }}/.private/artifacts/${{ steps.build_env.outputs.ARTIFACT_NAME }}
          IOS_APP_BUNDLE_ID: ${{ secrets.IOS_APP_BUNDLE_ID }}
        run: bundle exec fastlane ios upload_testflight

      - name: Cleanup signing files
        if: always()
        run: |
          rm -rf .private
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true

  notify:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Notify Feishu release bot
        env:
          FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL || vars.FEISHU_RELEASE_WEBHOOK_URL }}
          FEISHU_RELEASE_WEBHOOK_SECRET: ${{ secrets.FEISHU_RELEASE_WEBHOOK_SECRET || vars.FEISHU_RELEASE_WEBHOOK_SECRET }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_PLATFORM: ios
          RELEASE_REF: ${{ env.MOBILE_SOURCE_REF }}
          RELEASE_SOURCE_REPO: ${{ env.SOURCE_REPO }}
          RELEASE_VERSION: ${{ needs.build.outputs.version || needs.prepare.outputs.version || env.MOBILE_VERSION }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number || env.MOBILE_BUILD_NUMBER }}
          RELEASE_TARGETS: ${{ needs.prepare.outputs.target }}
          RELEASE_RELEASE_ENV: ${{ needs.prepare.outputs.release_env }}
          RELEASE_UPLOADED: ${{ needs.build.outputs.uploaded }}
          RELEASE_PIPELINE_REPO: ${{ github.repository }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-feishu-release.mjs
